<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReconTool — Búsqueda</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="page-home">
  <header class="site-header site-header-home">
    <div class="brand-center">
      <a href="/" class="brand-logo-link">
        <img src="/img/recontool-logo.png" alt="ReconTool" class="brand-logo hero-logo" />
      </a>
      <p class="tagline">Reconocimiento de vulnerabilidades.</p>
    </div>
  </header>

  <main class="search-hero">
    <h1>¿Qué IP quieres analizar?</h1>
    <form id="search-form" class="search-box" autocomplete="off">
      <input
        id="target-input"
        type="text"
        name="target"
        placeholder="Ej: 192.168.1.1 o scanme.nmap.org"
        required
        spellcheck="false"
      />
      <button type="submit">Escanear</button>
    </form>
  </main>

  <footer class="site-footer">
    <span>Master Ciberseguridad</span>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
